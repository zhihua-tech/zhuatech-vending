<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华无人零售运营中心</title><link rel="stylesheet" href="/styles.css"><style>:root{--accent:#cb5b20;--accent-soft:#fff0e7;--nav:#342117}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">ZH</span><div>知华无人零售<small>VENDING OPERATIONS</small></div></div><nav class="nav"><div class="active">经营总览</div><div>设备地图</div><div>商品中心</div><div>货道库存</div><div>订单与退款</div><div>补货任务</div><div>营销活动</div><div>设备运维</div></nav><div class="sidebar-foot">上海如静知华信息科技有限公司</div></aside><main class="main"><header class="top"><div><h1>无人零售经营总览</h1><div class="muted">设备经营、商品库存、出货履约和补货协同</div></div><span class="status"><i class="dot"></i>设备链路正常</span></header><section class="metrics" id="metrics"></section><div class="grid"><section class="card"><div class="section-title"><h2>设备经营状态</h2><button class="button">注册设备</button></div><div class="table-wrap"><table class="table"><thead><tr><th>设备</th><th>投放点位</th><th>温度</th><th>信号</th><th>状态</th></tr></thead><tbody id="machines"></tbody></table></div></section><aside class="card"><div class="section-title"><h2>库存预警</h2><span class="muted">优先补货</span></div><div id="slots"></div></aside></div><div class="grid equal"><section class="card"><div class="section-title"><h2>近期订单</h2><span class="pill">支付与出货</span></div><div id="orders"></div></section><section class="card"><div class="section-title"><h2>补货任务</h2><span class="muted">移动作业</span></div><div id="replenishments"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const labels={machines:'售货机',online:'在线设备',completedOrders:'完成订单',sales:'销售额',lowStockSlots:'低库存货道',openWorkOrders:'待处理故障'};metrics.innerHTML=Object.entries(d.metrics).slice(0,5).map(([k,v])=>`<div class="card metric"><span class="muted">${labels[k]}</span><strong>${k==='sales'?'¥':''}${v}</strong><em>${k==='lowStockSlots'&&v?'建议补货':'运行正常'}</em></div>`).join('');machines.innerHTML=d.machines.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.code)}</div></td><td>${esc(x.site)}</td><td>${x.temperature??6}℃</td><td>${x.signal??100}%</td><td><span class="pill ${x.status==='fault'?'danger':''}">${esc(x.status)}</span></td></tr>`).join('');slots.innerHTML=d.slots.filter(x=>x.quantity<=x.safetyStock).map(x=>`<div class="list-row"><div><strong>货道 ${esc(x.code)}</strong><span class="muted">库存 ${x.quantity}/${x.capacity} · 安全线 ${x.safetyStock}</span></div><span class="pill warning">待补</span></div>`).join('');orders.innerHTML=d.orders.map(x=>`<div class="list-row"><div><strong>${esc(x.orderNo)}</strong><span class="muted">${x.lines.length}件 · ${esc(x.status)}</span></div><strong>¥${x.payableAmount.toFixed(2)}</strong></div>`).join('');replenishments.innerHTML=d.replenishments.map(x=>`<div class="list-row"><div><strong>${esc(x.id)}</strong><span class="muted">${x.lines.length}个货道 · ${esc(x.status)}</span></div><span class="pill ${x.status==='pending'?'warning':''}">${esc(x.status)}</span></div>`).join('')})</script></body></html>
